<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script defer src="index.js"></script>
    <title>Document</title>
  </head>
  <body>
    <section id="navBarSection">
      <nav class="navBar">
        <img class="main__logo" src="./assets/Logo.png" alt="logo" />
        <ul class="nav__lists">
          <li class="nav__home">Home</li>
          <li class="nav__about">About</li>
          <li class="nav__lab">Lab</li>
        </ul>
      </nav>
    </section>
    <section id="heroSection">
      <div class="profile__img">
        <div class="profile__vector__wrapper">
          <img
            class="profile__avatar"
            src="./assets/profileRMBG.png"
            alt="Profile Avatar"
          />
        </div>
        <img
          class="profile__vector"
          src="./assets/Vector.svg"
          alt="vector Arrow 1"
        />
        <span class="profile__text"
          ><h5>Hello! I am</h5>
          <span class="purple__text"><h5>Aung Pyae Khant</h5></span></span
        >
      </div>
      <div class="hero__text">
        <h4 style="font-size: 10px; text-decoration: underline">
          A Designer who
        </h4>
        <h1 style="font-size: 30px">Judges a book</h1>
        <h1 style="font-size: 30px">
          by its <span class="purple__text">cover</span>...
        </h1>
        <h5 style="font-size: 8px">
          Because if the cover does not impress you what else can?
        </h5>
      </div>
    </section>
  </body>
</html>
